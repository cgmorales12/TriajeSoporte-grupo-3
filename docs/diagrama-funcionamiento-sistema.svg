<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="100%" height="100%" style="background:#ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Filtros de sombra -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <!-- Marcadores de flechas -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Encabezado -->
  <rect x="0" y="0" width="960" height="760" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">TecnoAula · ConectaTec: Flujo Interno de Arquitectura y Triaje</text>
  <text x="480" y="66" text-anchor="middle" font-size="13" fill="#64748b">Perímetro RAG Grounded, Triaje Estructurado con Pydantic y Protocolo de Silencio (Zero-Hallucination)</text>

  <!-- 1. Nodo Entrada: Mensaje del Usuario -->
  <g transform="translate(290, 95)" filter="url(#shadow)">
    <rect width="380" height="60" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="190" y="26" text-anchor="middle" font-size="13" font-weight="600" fill="#0369a1">Mensaje del Usuario / Docente</text>
    <text x="190" y="46" text-anchor="middle" font-size="12" font-style="italic" fill="#0284c7">«me sale Error 400»  ó  «falla de Wi-Fi / cable roto»</text>
  </g>

  <!-- Flecha 1 -->
  <path d="M 480 155 L 480 190" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Nodo IA: Triaje por LLM -->
  <g transform="translate(280, 195)" filter="url(#shadow)">
    <rect width="400" height="65" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="200" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">🤖 Triaje por Modelo LLM (Gemini / Groq)</text>
    <text x="200" y="48" text-anchor="middle" font-size="12" fill="#6d28d9">Clasificación Estructurada Pydantic: Categoría, Impacto y Urgencia</text>
  </g>

  <!-- Flecha 2 -->
  <path d="M 480 260 L 480 295" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Nodo Decisión: ¿Es avería de Red ISP? -->
  <g transform="translate(340, 300)" filter="url(#shadow)">
    <polygon points="140,0 280,45 140,90 0,45" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="140" y="38" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">¿Avería de Red ISP</text>
    <text x="140" y="56" text-anchor="middle" font-size="12" fill="#b45309">en los 15 Manuales?</text>
  </g>

  <!-- ================= RAMA IZQUIERDA: NO (ABSTENCIÓN) ================= -->
  <!-- Flecha Rama NO -->
  <path d="M 340 345 L 180 345 L 180 405" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="205" y="325" width="105" height="20" rx="4" fill="#fee2e2"/>
  <text x="257" y="339" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">❌ NO (Fuera Alcance)</text>

  <!-- 4. Protocolo de Abstención -->
  <g transform="translate(30, 415)" filter="url(#shadow)">
    <rect width="300" height="60" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="150" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">🚨 Protocolo de Abstención Oficial</text>
    <text x="150" y="46" text-anchor="middle" font-size="11" fill="#b91c1c">Regla de Silencio Determinista (Zero-Hallucination)</text>
  </g>

  <!-- Flecha Abstención a Citas Vacías -->
  <path d="M 180 475 L 180 505" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- 5. Cero Alucinaciones -->
  <g transform="translate(30, 515)" filter="url(#shadow)">
    <rect width="300" height="55" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="150" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#9f1239">Cero Alucinaciones de Manuales</text>
    <text x="150" y="42" text-anchor="middle" font-size="11" fill="#be123c">Citas RAG = Vacías [ ] · Sin inventar DOC-99</text>
  </g>

  <!-- Flecha a Tablero Fuera de Alcance -->
  <path d="M 180 570 L 180 600" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- 6. Tablero Kanban Nivel 0 -->
  <g transform="translate(30, 610)" filter="url(#shadow)">
    <rect width="300" height="65" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="150" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">🔘 Nivel 0 · Fuera de Alcance</text>
    <text x="150" y="42" text-anchor="middle" font-size="11" fill="#475569">💡 Orientación: «No corresponde a red ISP.</text>
    <text x="150" y="56" text-anchor="middle" font-size="11" fill="#475569">Acuda al soporte de la aplicación o Secretaría.»</text>
  </g>

  <!-- ================= RAMA DERECHA: SÍ (RAG GROUNDED) ================= -->
  <!-- Flecha Rama SÍ -->
  <path d="M 620 345 L 770 345 L 770 405" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="645" y="325" width="95" height="20" rx="4" fill="#dcfce7"/>
  <text x="692" y="339" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">✅ SÍ (Caso Técnico)</text>

  <!-- 7. Motor RAG ChromaDB -->
  <g transform="translate(620, 415)" filter="url(#shadow)">
    <rect width="300" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="150" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">📚 Motor RAG (ChromaDB Vectorial)</text>
    <text x="150" y="46" text-anchor="middle" font-size="11" fill="#15803d">Búsqueda Semántica sobre los 15 Manuales</text>
  </g>

  <!-- Flecha RAG a Citas -->
  <path d="M 770 475 L 770 505" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- 8. Cita Verificada -->
  <g transform="translate(620, 515)" filter="url(#shadow)">
    <rect width="300" height="55" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="150" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Cita Técnica Oficial Verificada</text>
    <text x="150" y="42" text-anchor="middle" font-size="11" fill="#047857">DOC-XX (Paso Y) + URL resoluble + Fragmento</text>
  </g>

  <!-- Flecha Cita a ITIL y HITL -->
  <path d="M 770 570 L 770 600" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- 9. Matriz ITIL + HITL -->
  <g transform="translate(620, 610)" filter="url(#shadow)">
    <rect width="300" height="65" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <text x="150" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">⚖️ Priorización ITIL + Compuerta HITL</text>
    <text x="150" y="42" text-anchor="middle" font-size="11" fill="#4338ca">Cálculo matemático de SLA (15m / 240m / 1440m)</text>
    <text x="150" y="56" text-anchor="middle" font-size="11" fill="#4338ca">Aprobación Humana antes de Enviar o Derivar</text>
  </g>

  <!-- Pie de página -->
  <text x="480" y="735" text-anchor="middle" font-size="11" fill="#94a3b8">Seminario de Titulación: Ingeniería de Software con IA Generativa — UNIANDES (Octubre - Noviembre 2026)</text>
</svg>

