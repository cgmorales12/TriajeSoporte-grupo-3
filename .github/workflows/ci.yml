name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pruebas:
    name: Pytest & Evaluacion Automatizada
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: Ejecutar suite de pruebas unitarias (Pytest con Mocks)
        env:
          GEMINI_API_KEY: "mock_test_key_for_ci"
          GROQ_API_KEY: "mock_test_key_for_ci"
          JWT_SECRET_KEY: "test_jwt_secret_key_ci_environment"
          ADMIN_PASSWORD: "test_admin_password_ci_environment"
        run: |
          python -m pytest -v --tb=short

      - name: Ejecutar suite de evaluacion de calidad (run_eval.py)
        env:
          GEMINI_API_KEY: "mock_test_key_for_ci"
          GROQ_API_KEY: "mock_test_key_for_ci"
          JWT_SECRET_KEY: "test_jwt_secret_key_ci_environment"
          ADMIN_PASSWORD: "test_admin_password_ci_environment"
        run: |
          python run_eval.py
