services:
  - type: web
    name: triajesoporte-grupo-3
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python scripts/ingest.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
